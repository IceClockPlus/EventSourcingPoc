services:
  sqlserver2025:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sqlserver_2025
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  web-api:
    image: guarantee-app:latest
    build:
      context: .
      dockerfile: EventSourcingPoc.API/Dockerfile
    container_name: dotnet_guarantee_api
    ports:
      - "8080:8080"
    environment:
      - APPLY_MIGRATION=true
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DbPersistence=Server=sqlserver2025,1433;Database=guarantee-events;User Id=sa;Password=r34toiR34T4O!5;TrustServerCertificate=True;
    depends_on:
      sqlserver2025:
        condition: service_healthy
        restart: true
    restart: unless-stopped
volumes:
  mssql_data:
